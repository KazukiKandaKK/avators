<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avators - WebGPU 2D アニメアバターエディタ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #333;
    }
    header {
      padding: 1rem 1.5rem;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    main {
      display: flex;
      height: calc(100vh - 60px);
    }
    #canvas {
      flex: 1;
      min-width: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #controls {
      flex-shrink: 0;
      width: 300px;
      padding: 1rem 1.25rem;
      background: #fff;
      border-left: 1px solid #ddd;
      overflow-y: auto;
    }
    .control {
      margin-bottom: 1rem;
    }
    .control label {
      display: block;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 0.25rem;
    }
    .control input[type="range"] {
      width: 100%;
    }
    .control input[type="color"] {
      width: 100%;
      height: 36px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: none;
    }
    .value {
      font-size: 0.8rem;
      color: #777;
      float: right;
    }
    #reset {
      width: 100%;
      padding: 0.6rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #reset:hover { background: #1d4ed8; }
    .hint {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #888;
      line-height: 1.4;
    }
    .error {
      position: fixed;
      inset: 0 0 auto 0;
      padding: 1rem 1.5rem;
      background: #fee;
      color: #900;
      border-bottom: 1px solid #fcc;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Avators</h1>
    <span>WebGPU 2D アニメアバターエディタ</span>
  </header>
  <main>
    <canvas id="canvas"></canvas>
    <aside id="controls">
      <div class="control">
        <label>頭の大きさ <span class="value" id="headRadiusValue"></span></label>
        <input id="headRadius" type="range" min="0.5" max="1.2" step="0.01">
      </div>
      <div class="control">
        <label>髪の量 <span class="value" id="hairAmountValue"></span></label>
        <input id="hairAmount" type="range" min="0" max="0.4" step="0.01">
      </div>
      <div class="control">
        <label>肌の色</label>
        <input id="skinColor" type="color">
      </div>
      <div class="control">
        <label>髪の色</label>
        <input id="hairColor" type="color">
      </div>
      <div class="control">
        <label>目の色</label>
        <input id="eyeColor" type="color">
      </div>
      <div class="control">
        <label>目の大きさ <span class="value" id="eyeSizeValue"></span></label>
        <input id="eyeSize" type="range" min="0.03" max="0.28" step="0.01">
      </div>
      <div class="control">
        <label>目の間隔 <span class="value" id="eyeSpacingValue"></span></label>
        <input id="eyeSpacing" type="range" min="0.05" max="0.5" step="0.01">
      </div>
      <div class="control">
        <label>口の幅 <span class="value" id="mouthWidthValue"></span></label>
        <input id="mouthWidth" type="range" min="0.05" max="0.5" step="0.01">
      </div>
      <div class="control">
        <label>笑顔 <span class="value" id="mouthSmileValue"></span></label>
        <input id="mouthSmile" type="range" min="0" max="0.3" step="0.01">
      </div>
      <button id="reset">デフォルトに戻す</button>
      <p class="hint">スライダーとカラーピッカーでアバターをカスタマイズできます。WebGPU対応ブラウザが必要です。</p>
    </aside>
  </main>
  <div id="error" class="error hidden"></div>
  <script type="module" src="src/presentation/main.js"></script>
</body>
</html>
